name: Checks

# The same checks the Pages deploy runs, without deploying: every push to a
# branch and every pull request is typechecked, linted, tested and built, so a
# change is known to pass before it is merged to main.

on:
  push:
    branches-ignore: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Rynk WASM client
        run: npm run wasm

      # Kept so a checkout without Nix can run every test (scripts/wasm-from-ci.sh):
      # the built clients and a fingerprint of the files that define them.
      - name: Keep the WASM build
        run: |
          mkdir -p wasm-build
          cp -rL src/vendor/rynk-wasm src/vendor/moergo-config-wasm wasm-build/
          sh scripts/wasm-recipe.sh > wasm-build/recipe.sha256

      - name: Upload the WASM build
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: wasm-build
          retention-days: 30

      - name: Typecheck
        run: npm exec -- tsc -b

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build static site
        run: npm exec vite build
